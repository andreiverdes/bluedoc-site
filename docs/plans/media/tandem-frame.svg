<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, Menlo, monospace">
  <style>
    .stage { fill: #e9eef8; }
    .win { fill: #ffffff; stroke: #b9c4dc; }
    .term { fill: #0b1020; stroke: #26304a; }
    .bar { fill: #dfe6f3; }
    .tbar { fill: #161d33; }
    .ink { fill: #1d2a4a; }
    .dim { fill: #6a7896; }
    .tink { fill: #dfe7ff; }
    .tdim { fill: #7d8aac; }
    .ok { fill: #3ccf8e; }
    .blue { fill: #0a6dff; }
    .amber { fill: none; stroke: #e0a030; stroke-dasharray: 8 6; stroke-width: 2; }
    .row { fill: #f1f4fa; stroke: #d3dbea; }
    .rowon { fill: #e3eeff; stroke: #0a6dff; }
    .cap { fill: #0a6dff; }
    @media (prefers-color-scheme: dark) {
      .stage { fill: #070b18; }
      .win { fill: #0d1530; stroke: #2a3760; }
      .bar { fill: #121c3c; }
      .ink { fill: #e6eeff; }
      .dim { fill: #8b98ba; }
      .row { fill: #111a38; stroke: #26335c; }
      .rowon { fill: #0f2550; stroke: #4f9bff; }
      .cap { fill: #4f9bff; }
    }
  </style>
  <rect class="stage" width="1600" height="1000"/>

  <!-- caption -->
  <text x="800" y="62" text-anchor="middle" font-size="30" class="cap" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Your agent was already waiting.</text>

  <!-- terminal: the narrator, about a third of the width -->
  <rect class="term" x="60" y="150" width="540" height="740" rx="10"/>
  <rect class="tbar" x="60" y="150" width="540" height="34" rx="10"/>
  <circle cx="84" cy="167" r="6" fill="#ff5f57"/><circle cx="104" cy="167" r="6" fill="#febc2e"/><circle cx="124" cy="167" r="6" fill="#28c840"/>
  <text x="330" y="172" text-anchor="middle" font-size="13" class="tdim">acme-shop — claude</text>
  <g font-size="15">
    <text x="84" y="226" class="tink">❯ Let shoppers save a cart and come</text>
    <text x="84" y="248" class="tink">  back to it later.</text>
    <text x="84" y="290" class="ok">●</text><text x="104" y="290" class="tink">Write(docs/plans/saved-carts.bluedoc.json)</text>
    <text x="84" y="324" class="ok">●</text><text x="104" y="324" class="tink">ExitPlanMode</text>
    <text x="104" y="346" class="tdim">⎿ bluedoc opened this plan for the</text>
    <text x="104" y="368" class="tdim">  reader at 127.0.0.1:8740/… The reader</text>
    <text x="104" y="390" class="tdim">  answers on that page, not here.</text>
    <text x="84" y="432" class="ok">●</text><text x="104" y="432" class="tink">Bash(serve.py wait saved-carts --kind any)</text>
    <text x="84" y="476" class="tink">--- bluedoc approval (reply 3, rev 1) ---</text>
    <text x="84" y="500" class="tink"># Plan approved: saved carts (rev 1)</text>
    <text x="84" y="524" class="tink">## Decisions</text>
    <text x="84" y="548" class="tdim">- Retention → **180 days** (recommended)</text>
    <text x="84" y="572" class="tdim">- Who saves → Accounts, Business, Guests</text>
    <text x="84" y="596" class="tink">## Notes with the approval</text>
    <text x="84" y="620" class="tdim">- sweeper: run it on the jobs queue</text>
    <text x="84" y="644" class="tink">--- end ---</text>
    <text x="84" y="688" class="ok">●</text><text x="104" y="688" class="tink">Implementing rev 1 with your picks.</text>
    <text x="84" y="722" class="ok">●</text><text x="104" y="722" class="tink">Write(migrations/0012_saved_carts.sql)</text>
  </g>
  <text x="84" y="866" font-size="13" class="tdim">⏸ plan mode on (shift+tab to cycle)</text>

  <!-- bluedoc: the anchor, about five eighths of the width -->
  <rect class="win" x="640" y="110" width="900" height="820" rx="10"/>
  <rect class="bar" x="640" y="110" width="900" height="38" rx="10"/>
  <circle cx="664" cy="129" r="6" fill="#ff5f57"/><circle cx="684" cy="129" r="6" fill="#febc2e"/><circle cx="704" cy="129" r="6" fill="#28c840"/>
  <text x="1090" y="134" text-anchor="middle" font-size="13" class="dim">127.0.0.1:8740 / saved-carts</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="680" y="196" font-size="24" font-weight="600" class="ink">Acme Shop: saved carts</text>
    <rect x="1330" y="176" width="180" height="28" rx="4" class="rowon"/>
    <text x="1420" y="195" text-anchor="middle" font-size="13" class="cap">Approved · rev 1</text>
    <text x="680" y="236" font-size="15" class="dim">Approach: new parts dashed in amber</text>
    <rect x="680" y="256" width="170" height="70" rx="4" class="row"/><text x="765" y="296" text-anchor="middle" font-size="14" class="ink">orders-api</text>
    <rect x="900" y="256" width="170" height="70" rx="4" class="amber"/><text x="985" y="296" text-anchor="middle" font-size="14" class="ink">saved_carts</text>
    <rect x="1120" y="256" width="170" height="70" rx="4" class="amber"/><text x="1205" y="296" text-anchor="middle" font-size="14" class="ink">sweeper</text>
    <rect x="1296" y="246" width="26" height="26" rx="13" class="blue"/><text x="1309" y="265" text-anchor="middle" font-size="13" fill="#fff">1</text>
    <text x="680" y="380" font-size="18" font-weight="600" class="ink">How long does a saved cart stay?</text>
    <rect x="680" y="396" width="560" height="40" rx="4" class="row"/><text x="700" y="421" font-size="15" class="dim">90 days</text>
    <rect x="680" y="442" width="560" height="40" rx="4" class="rowon"/><text x="700" y="467" font-size="15" class="ink">✓ 180 days</text><text x="1220" y="467" text-anchor="end" font-size="12" fill="#e0a030">★ RECOMMENDED</text>
    <rect x="680" y="488" width="560" height="40" rx="4" class="row"/><text x="700" y="513" font-size="15" class="dim">Until deleted</text>
    <text x="680" y="580" font-size="18" font-weight="600" class="ink">Who can save a cart?</text>
    <rect x="680" y="596" width="560" height="40" rx="4" class="rowon"/><text x="700" y="621" font-size="15" class="ink">✓ Personal accounts</text>
    <rect x="680" y="642" width="560" height="40" rx="4" class="rowon"/><text x="700" y="667" font-size="15" class="ink">✓ Business accounts</text>
    <rect x="680" y="688" width="560" height="40" rx="4" class="rowon"/><text x="700" y="713" font-size="15" class="ink">✓ Guests, by email link</text>
    <rect x="1290" y="840" width="220" height="48" rx="6" class="blue"/><text x="1400" y="870" text-anchor="middle" font-size="16" fill="#fff" font-weight="600">Approve plan</text>
  </g>
</svg>
