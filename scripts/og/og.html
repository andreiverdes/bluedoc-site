<!doctype html>
<!-- The social card (public/og.png, 1200 × 630). Edit the headline here, then run `npm run og`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Lexend';
        font-weight: 100 900;
        src: url(../../node_modules/@fontsource-variable/lexend/files/lexend-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url(../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 100 900;
        src: url(../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Geist Pixel';
        src: url(../../node_modules/@fontsource/geist-pixel/files/geist-pixel-latin-400-normal.woff2) format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05070f;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Geist', sans-serif;
        color: #eaf4ff;
      }
      /* the banner at 1.2× its source pixels, shifted so the city sits left and the ringed planet right */
      .art {
        position: absolute;
        left: -400px;
        top: 0;
        width: 2006px;
        height: 628px;
        background: url(../../src/assets/hero/hero-dark.webp) 0 0 / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to top, #05070f 0%, rgb(5 7 15 / 0.92) 30%, rgb(5 7 15 / 0.35) 62%, rgb(5 7 15 / 0) 80%),
          linear-gradient(to right, rgb(5 7 15 / 0.55), rgb(5 7 15 / 0) 60%);
      }
      .copy {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: 'Lexend', sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 56px;
        height: 56px;
      }
      .brand .b {
        color: #eaf4ff;
      }
      .brand .d {
        color: #4f9bff;
      }
      /* the home's headline: Geist 500, one word in the pixel face in bluedoc blue */
      h1 {
        margin: 26px 0 0;
        font-family: 'Geist', sans-serif;
        font-weight: 500;
        font-size: 64px;
        line-height: 1.04;
        letter-spacing: -0.045em;
        text-shadow: 0 2px 24px rgb(5 7 15 / 0.8);
      }
      h1 .px {
        font-family: 'Geist Pixel', monospace;
        font-weight: 400;
        letter-spacing: -0.02em;
        color: #4f9bff;
      }
      .tag {
        margin-top: 24px;
        font-family: 'Geist Mono', monospace;
        font-weight: 450;
        font-size: 17px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8fb8ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="art"></div>
      <div class="shade"></div>
      <div class="copy">
        <div class="brand"><img src="../../public/favicon.svg" alt="" /><span><span class="b">blue</span><span class="d">doc</span></span></div>
        <h1>Plan, document, design and more.<br />A <span class="px">visual</span> reply to your verbose agent.</h1>
        <div class="tag">Docs · Plans · Reviews · Designs · Decks · Websites · Store listings</div>
      </div>
    </div>
  </body>
</html>
